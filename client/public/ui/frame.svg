<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Nine-slice panel frame (24 px corners): forged iron with a worn gold inlay. Original artwork. -->
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5550"/>
      <stop offset="0.5" stop-color="#2c2824"/>
      <stop offset="1" stop-color="#151210"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead39a"/>
      <stop offset="1" stop-color="#8a6a2e"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="90" height="90" fill="none" stroke="#0a0908" stroke-width="6"/>
  <rect x="3" y="3" width="90" height="90" fill="none" stroke="url(#iron)" stroke-width="4"/>
  <rect x="8.5" y="8.5" width="79" height="79" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.55"/>
  <g id="corner" fill="url(#iron)" stroke="#0a0908" stroke-width="1.2">
    <path d="M1 1 H22 L18 6 H6 V18 L1 22 Z"/>
    <circle cx="7" cy="7" r="3.2" fill="url(#gold)"/>
    <path d="M12 3 C 16 9, 9 16, 3 12" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.8"/>
  </g>
  <use href="#corner" transform="translate(96 0) scale(-1 1)"/>
  <use href="#corner" transform="translate(0 96) scale(1 -1)"/>
  <use href="#corner" transform="translate(96 96) scale(-1 -1)"/>
</svg>
