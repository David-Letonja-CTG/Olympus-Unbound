# The game server's production stack (D21, docs/hosting.md). Values come from the .env file next to this file, which
# the deploy workflow writes from the GitHub "production" environment; nothing secret lives in the repository.
#   TAG                image tag (a commit SHA)          IMAGE_PREFIX   e.g. ghcr.io/david-letonja-ctg
#   SITE_ADDRESS       host name, or ":80" for HTTP      POSTGRES_PASSWORD
#   ALLOWED_ORIGINS    the game's site, e.g. https://david-letonja-ctg.github.io
#   ADMIN_TOKEN        hides world board entries (optional)
#   HTTP_PORT, HTTPS_PORT  host ports (80 and 443 by default; only changed for local tests)
name: olympus

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/david-letonja-ctg}/olympus-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/david-letonja-ctg}/olympus-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://olympus:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/olympus
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Behind Caddy: the client's address comes from X-Forwarded-For (limits only; never stored).
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: olympus
      POSTGRES_USER: olympus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympus -d olympus"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

volumes:
  pgdata:
  caddy-data:
  caddy-config:
