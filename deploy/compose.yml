# The game server on a shared VM (D21, docs/hosting.md#the-game-server): one container serving the game, its API and
# its rooms. It joins the host stack's network: the host's Caddy serves it at its own name (the site block install.sh
# writes) and the host's PostgreSQL holds the `olympus` database. Values come from the .env file next to this file,
# which the deploy workflow writes from GitHub settings; nothing secret lives in the repository.
#   TAG                image tag (a commit SHA)          IMAGE_PREFIX   e.g. ghcr.io/david-letonja-ctg
#   POSTGRES_PASSWORD  the olympus role's password (letters and digits)
#   ALLOWED_ORIGINS    origins allowed to call it from a browser (this site)
#   ADMIN_TOKEN        hides world board entries (optional)
#   HOST_NETWORK       the host stack's network
name: olympus

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # A name of its own: every service on the shared network answers by its service name.
  olympus-api:
    image: ${IMAGE_PREFIX:-ghcr.io/david-letonja-ctg}/olympus-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://olympus:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/olympus
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Behind Caddy: the client's address comes from X-Forwarded-For (limits only; never stored).
      TRUST_PROXY: "1"
    networks:
      - host
    logging: *logging

networks:
  host:
    name: ${HOST_NETWORK:?set HOST_NETWORK}
    external: true
