# A stand-in for Slovion's stack on its VM, for testing install.sh (CI, and locally): the same project name, network,
# database superuser and Caddy setup (admin inside the container, sites/ imported). SITES_DIR is the sites/ folder.
name: slovion

services:
  web:
    image: caddy:2
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SITES_DIR:?set SITES_DIR}:/etc/caddy/sites:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: slovion
      POSTGRES_USER: slovion
      POSTGRES_PASSWORD: slovion_test # tests only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slovion -d slovion"]
      interval: 2s
      timeout: 3s
      retries: 30
