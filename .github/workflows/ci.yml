name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  client:
    name: Client (format, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check asset licences
        run: npm run assets:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: olympus-unbound-web
          path: client/dist/olympus-unbound/browser
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install
        run: npm ci

      # Playwright starts the game server too (boards in memory): rooms and world boards (D21).
      - name: Install the game server
        working-directory: server
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Playwright starts the development server itself (debug hooks exist only in development builds).
      - name: Test
        run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

  server:
    name: Server (format, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # A real database for the PostgreSQL tests (D21).
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: olympus
          POSTGRES_PASSWORD: olympus_ci # CI only
          POSTGRES_DB: olympus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olympus -d olympus"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          DATABASE_URL: postgres://olympus:olympus_ci@localhost:5432/olympus
        run: npm test

      - name: Build
        run: npm run build

  stack:
    name: Server on a stand-in Slovion stack (install, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -f deploy/api.Dockerfile -t ci/olympus-api:test .

      # Slovion's stack as the game server finds it on the VM: its PostgreSQL, and its Caddy importing sites/.
      - name: A stand-in Slovion stack
        run: |
          mkdir -p "$RUNNER_TEMP/slovion/sites"
          SITES_DIR="$RUNNER_TEMP/slovion/sites" docker compose -f deploy/test/slovion.compose.yml up -d --wait

      # The same script the deploy runs on the VM, twice: running it again must change nothing.
      - name: Install the game server
        run: |
          mkdir -p "$RUNNER_TEMP/olympus"
          cp deploy/compose.yml deploy/olympus.caddy deploy/install.sh "$RUNNER_TEMP/olympus/"
          cat > "$RUNNER_TEMP/olympus/.env" <<EOF
          IMAGE_PREFIX=ci
          TAG=test
          POSTGRES_PASSWORD=olympusci12345
          OLYMPUS_ADDRESS=:80
          SLOVION_DIR=$RUNNER_TEMP/slovion
          EOF
          bash "$RUNNER_TEMP/olympus/install.sh"
          bash "$RUNNER_TEMP/olympus/install.sh"

      - name: Smoke test
        run: bash deploy/smoke-test.sh http://localhost:8080

      - name: Logs
        if: failure()
        run: |
          docker logs slovion-web-1 || true
          docker logs olympus-olympus-api-1 || true
