name: Deploy

# Puts a release online (docs/hosting.md): when a GitHub Release (not a pre-release) is published, or by hand for an
# existing version tag. The game server (D21) goes to its VM first, when the repository variable SERVER_ADDRESS is
# set; then the game goes to GitHub Pages, built with that server's address. The built game is also attached to the
# release as a zip. Merges to main only run CI.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to deploy (e.g. v0.1.0)
        required: true

permissions:
  contents: read

# One deploy at a time; a newer one waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

env:
  NG_CLI_ANALYTICS: "false"

jobs:
  build:
    name: Build the release
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the zip to the release
      actions: read # read the CI run of the release's commit
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version tag like v1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.version }}

      # Only commits that passed CI on main go live; waits up to 30 minutes for a CI run still in progress.
      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          for _ in $(seq 1 60); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --event push \
              --json status,conclusion --jq 'if length == 0 then "" else (.[0] | "\(.status) \(.conclusion)") end')
            case "$run" in
              "completed success") echo "CI passed for $sha"; exit 0 ;;
              completed*) echo "::error::CI failed for $sha ($run)"; exit 1 ;;
              "") echo "::error::no CI run on main for $sha; release only commits that are on main"; exit 1 ;;
            esac
            echo "CI is $run; waiting"
            sleep 30
          done
          echo "::error::CI did not finish within 30 minutes"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      # For the zip: the game served from the root of any static host.
      - name: Build for download
        working-directory: client
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx ng build --base-href /
          node scripts/entry-pages.mjs
          (cd dist/olympus-unbound/browser && zip -qr "$GITHUB_WORKSPACE/olympus-unbound-$VERSION.zip" .)

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "$VERSION" "olympus-unbound-$VERSION.zip" --clobber --repo "$GITHUB_REPOSITORY"

      # For GitHub Pages: the project site lives under /<repository>/. Pages answers unknown paths with 404.html,
      # which is the app itself, so deep links such as /play load the game; shared addresses (challenge links, room
      # invites) get pages of their own so chat apps show their preview (scripts/entry-pages.mjs).
      # With the game server's address when there is one (D21); without, co-op and the world boards are not offered.
      - name: Build for GitHub Pages
        working-directory: client
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          SERVER_ADDRESS: ${{ vars.SERVER_ADDRESS }}
        run: |
          if [ -n "$SERVER_ADDRESS" ]; then
            npx ng build --base-href "/$REPOSITORY/" --define "OLYMPUS_SERVER='https://$SERVER_ADDRESS'"
          else
            npx ng build --base-href "/$REPOSITORY/"
          fi
          node scripts/entry-pages.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist/olympus-unbound/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, server-images, server-deploy]
    # After the game server, or without one (SERVER_ADDRESS unset skips both); never after a failed image build or deploy.
    if: >-
      always() && needs.build.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.server-images.result)
      && contains(fromJSON('["success", "skipped"]'), needs.server-deploy.result)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      # The site, a deep link, the game's own files and the installed app's manifest and file list answer (D18).
      - name: Smoke test
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for _ in $(seq 1 24); do
            if curl -fsS -o /dev/null --max-time 10 "$SITE" \
              && curl -fsS -o /dev/null --max-time 10 "${SITE}assets/olympus/zeus.png" \
              && curl -fsS -o /dev/null --max-time 10 "${SITE}manifest.webmanifest" \
              && curl -fsS -o /dev/null --max-time 10 "${SITE}ngsw.json" \
              && curl -fsS -o /dev/null --max-time 10 "${SITE}challenge?g=zeus"; then
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${SITE}play")
              if curl -s --max-time 10 "${SITE}play" | grep -q '<app-root'; then
                echo "live at $SITE (deep link answered $code with the app)"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::$SITE did not serve the game within 2 minutes"
          exit 1

  server-images:
    name: Build the game server images
    # Only when the game server is set up (docs/hosting.md): the repository variable SERVER_ADDRESS.
    if: vars.SERVER_ADDRESS != '' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    needs: build # the version check and CI check run there first
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.build.outputs.version }}

      - name: Image names
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "prefix=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TypeScript compiles on the runner and the runtime installs only JavaScript, so arm64 needs no emulation.
      - name: API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/olympus-api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/olympus-api:${{ needs.build.outputs.version }}
            ${{ steps.meta.outputs.prefix }}/olympus-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/olympus-web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/olympus-web:${{ needs.build.outputs.version }}
            ${{ steps.meta.outputs.prefix }}/olympus-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  server-deploy:
    name: Deploy the game server
    needs: [build, server-images]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.SERVER_ADDRESS }}/health
    env:
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PREFIX: ${{ needs.server-images.outputs.prefix }}
      TAG: ${{ needs.server-images.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      SITE_ADDRESS: ${{ vars.SERVER_ADDRESS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.server-images.outputs.tag }}

      - name: SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # The game's site may call the server; nothing else in a browser may (CORS, WebSocket origin).
      - name: Configuration for this version
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BACKUP_URL: ${{ secrets.BACKUP_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          umask 077
          {
            echo "IMAGE_PREFIX=$PREFIX"
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
            echo "SITE_ADDRESS=$SITE_ADDRESS"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "BACKUP_URL=$BACKUP_URL"
            echo "ADMIN_TOKEN=$ADMIN_TOKEN"
            echo "ALLOWED_ORIGINS=https://${OWNER,,}.github.io"
          } > env.next

      - name: Copy the stack to the VM
        run: scp -q deploy/compose.yml deploy/backup.sh env.next "$TARGET:/opt/olympus/"

      - name: Start the new version
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # The token travels on stdin, never on a command line.
          printf '%s\n' "$REGISTRY_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin >/dev/null"
          ssh "$TARGET" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/olympus
          chmod +x backup.sh
          if [ -f .env ]; then cp .env .env.previous; fi
          mv env.next .env
          chmod 600 .env
          docker compose pull --quiet
          docker compose up -d --remove-orphans
          EOF

      - name: Wait for the health check
        id: health
        run: |
          for _ in $(seq 1 36); do
            if curl -fsS -o /dev/null --max-time 5 "https://$SITE_ADDRESS/health"; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$SITE_ADDRESS/health did not answer 200 within 3 minutes"
          exit 1

      - name: Roll back to the previous version
        if: failure() && steps.health.outcome == 'failure'
        run: |
          ssh "$TARGET" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/olympus
          docker compose logs --tail 100 api web || true
          if [ -f .env.previous ]; then
            cp .env.previous .env
            docker compose up -d --remove-orphans
            echo "rolled back to $(grep '^TAG=' .env)"
          else
            echo "no previous version to roll back to"
          fi
          EOF

      - name: Remove old images
        if: success()
        run: |
          ssh "$TARGET" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/olympus
          # The first deploy has no .env.previous; grep must not end the script then.
          previous="$(grep '^TAG=' .env.previous 2>/dev/null | cut -d= -f2 || true)"
          keep=" $(grep '^TAG=' .env | cut -d= -f2) $previous "
          docker images --format '{{.Repository}}:{{.Tag}}' | { grep -E '/olympus-(api|web):' || true; } | while read -r image; do
            case "$keep" in *" ${image##*:} "*) ;; *) docker rmi "$image" >/dev/null || true ;; esac
          done
          docker image prune -f >/dev/null
          EOF

      - name: Smoke test
        run: bash deploy/smoke-test.sh "https://$SITE_ADDRESS"

      - name: Sign out of the registry
        if: always()
        run: ssh "$TARGET" "docker logout ghcr.io >/dev/null" || true
