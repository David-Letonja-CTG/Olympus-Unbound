name: Deploy

# Puts a release online (docs/hosting.md): when a GitHub Release (not a pre-release) is published, or by hand for an
# existing version tag. The game server (D21) serves the game, its API and its rooms from the VM at SERVER_ADDRESS.
# The built game is also attached to the release as a zip. Merges to main only run CI.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to deploy (e.g. v0.1.0)
        required: true

permissions:
  contents: read

# One deploy at a time; a newer one waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  NG_CLI_ANALYTICS: "false"

jobs:
  build:
    name: Build the release
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the zip to the release
      actions: read # read the CI run of the release's commit
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version tag like v1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.version }}

      # Only commits that passed CI on main go live; waits up to 30 minutes for a CI run still in progress.
      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          for _ in $(seq 1 60); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --event push \
              --json status,conclusion --jq 'if length == 0 then "" else (.[0] | "\(.status) \(.conclusion)") end')
            case "$run" in
              "completed success") echo "CI passed for $sha"; exit 0 ;;
              completed*) echo "::error::CI failed for $sha ($run)"; exit 1 ;;
              "") echo "::error::no CI run on main for $sha; release only commits that are on main"; exit 1 ;;
            esac
            echo "CI is $run; waiting"
            sleep 30
          done
          echo "::error::CI did not finish within 30 minutes"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      # For the zip: the game served from the root of any static host.
      - name: Build for download
        working-directory: client
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx ng build --base-href /
          node scripts/entry-pages.mjs
          (cd dist/olympus-unbound/browser && zip -qr "$GITHUB_WORKSPACE/olympus-unbound-$VERSION.zip" .)

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "$VERSION" "olympus-unbound-$VERSION.zip" --clobber --repo "$GITHUB_REPOSITORY"

  server-image:
    name: Build the game server image (with the game)
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    needs: build # the version check and CI check run there first
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.build.outputs.version }}

      - name: Image name
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "prefix=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TypeScript compiles on the runner and the runtime installs only JavaScript, so arm64 needs no emulation.
      - name: API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/olympus-api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/olympus-api:${{ needs.build.outputs.version }}
            ${{ steps.meta.outputs.prefix }}/olympus-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  server-deploy:
    name: Deploy the game server
    needs: [build, server-image]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.SERVER_ADDRESS }}/health
    env:
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      PREFIX: ${{ needs.server-image.outputs.prefix }}
      TAG: ${{ needs.server-image.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      SERVER_ADDRESS: ${{ vars.SERVER_ADDRESS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.server-image.outputs.tag }}

      - name: SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # The game and its server share one address: only that site may call the server from a browser.
      - name: Configuration for this version
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          HOST_DIR: ${{ vars.HOST_DIR }}
          HOST_PROJECT: ${{ vars.HOST_PROJECT }}
          HOST_DB_USER: ${{ vars.HOST_DB_USER }}
        run: |
          umask 077
          {
            echo "IMAGE_PREFIX=$PREFIX"
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
            echo "OLYMPUS_ADDRESS=$SERVER_ADDRESS"
            echo "ALLOWED_ORIGINS=https://$SERVER_ADDRESS"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "ADMIN_TOKEN=$ADMIN_TOKEN"
            echo "HOST_DIR=$HOST_DIR"
            echo "HOST_PROJECT=$HOST_PROJECT"
            echo "HOST_DB_USER=$HOST_DB_USER"
            echo "HOST_NETWORK=${HOST_PROJECT}_default"
          } > env.next

      - name: Copy to the VM
        run: |
          ssh "$TARGET" "mkdir -p olympus"
          scp -q deploy/compose.yml deploy/olympus.caddy deploy/install.sh env.next "$TARGET:olympus/"

      - name: Start the new version
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # The token travels on stdin, never on a command line.
          printf '%s\n' "$REGISTRY_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin >/dev/null"
          ssh "$TARGET" bash -s <<'EOF'
          set -euo pipefail
          cd ~/olympus
          if [ -f .env ]; then cp .env .env.previous; fi
          mv env.next .env
          chmod 600 .env
          bash install.sh
          EOF

      - name: Wait for the health check
        id: health
        run: |
          for _ in $(seq 1 36); do
            if curl -fsS -o /dev/null --max-time 5 "https://$SERVER_ADDRESS/health"; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$SERVER_ADDRESS/health did not answer 200 within 3 minutes"
          exit 1

      - name: Roll back to the previous version
        if: failure() && steps.health.outcome == 'failure'
        run: |
          ssh "$TARGET" bash -s <<'EOF'
          set -euo pipefail
          cd ~/olympus
          docker compose logs --tail 100 olympus-api || true
          if [ -f .env.previous ]; then
            cp .env.previous .env
            bash install.sh
            echo "rolled back to $(grep '^TAG=' .env)"
          else
            echo "no previous version to roll back to"
          fi
          EOF

      # The test's own world board entry is hidden again with the admin token.
      - name: Smoke test
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: bash deploy/smoke-test.sh "https://$SERVER_ADDRESS"

      - name: Remove old images
        if: success()
        run: |
          ssh "$TARGET" bash -s <<'EOF'
          set -euo pipefail
          cd ~/olympus
          # The first deploy has no .env.previous; grep must not end the script then.
          previous="$(grep '^TAG=' .env.previous 2>/dev/null | cut -d= -f2 || true)"
          keep=" $(grep '^TAG=' .env | cut -d= -f2) $previous "
          docker images --format '{{.Repository}}:{{.Tag}}' | { grep -E '/olympus-api:' || true; } | while read -r image; do
            case "$keep" in *" ${image##*:} "*) ;; *) docker rmi "$image" >/dev/null || true ;; esac
          done
          EOF

      - name: Sign out of the registry
        if: always()
        run: ssh "$TARGET" "docker logout ghcr.io >/dev/null" || true
